[package]
name = "yolk-harvest"
version = "0.1.0"
edition = "2021"
description = "2yolks source harvester: robots-respecting fetch, schema.org normalization with provenance, local review queue. Nothing publishes automatically."
license = "UNLICENSED"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
