name: CI

on:
  push:
    branches: [main, workers-skeleton]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:routes
      - run: npm run build
      - name: Bundle worker (dry run, no deploy)
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-dist

  yolk-harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - run: cargo test --locked
        working-directory: crates/yolk-harvest
